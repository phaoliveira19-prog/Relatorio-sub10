<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preenchimento · QG do Treinador</title>
<style>
:root{
  color-scheme: dark;
  --bg:#05070c; --panel:#0a101c; --panel2:#0f1726; --card:#101827dd; --stroke:#253047; --stroke2:#1b2538;
  --text:#edf4ff; --muted:#8fa1bd; --soft:#b8c8df; --cyan:#22d3ee; --blue:#60a5fa; --green:#32d583; --yellow:#fdb022; --red:#f97066;
  --radius:18px;
}
body.light{
  color-scheme: light;
  --bg:#f3f7fb; --panel:#ffffff; --panel2:#eef4fb; --card:#ffffffee; --stroke:#cbd7e6; --stroke2:#d9e3ef;
  --text:#0b1220; --muted:#526276; --soft:#314156;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
h1,h2,h3{margin:0}
input,select,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:12px;color:var(--text);padding:10px 11px;font-size:14px;font-family:inherit}
input[readonly]{opacity:.65;cursor:not-allowed}
body.light input,body.light select,body.light textarea{background:#fff}
textarea{resize:vertical;min-height:64px}
label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin:0 0 6px}
.field{margin-bottom:14px}
.photo-upload-row{display:flex;align-items:center;gap:14px}
.photo-preview{width:64px;height:64px;border-radius:16px;object-fit:cover;background:#111b2e;border:1px solid var(--stroke);flex:0 0 auto}
.photo-upload-row input[type=file]{padding:9px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--stroke);border-radius:14px;background:rgba(255,255,255,.055);color:var(--text);padding:11px 16px;cursor:pointer;font-weight:800;font-size:14px;text-decoration:none}
.btn .ico{font-size:15px;line-height:1}
.btn.primary{background:linear-gradient(135deg,var(--cyan),#4f8cff);color:#06101b;border:0}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-bottom:1px solid var(--stroke2);background:linear-gradient(180deg,rgba(10,15,25,.90),rgba(10,15,25,.88)),url('./photos/capa-bg.jpg');background-size:auto,cover;background-position:center,center 30%;background-repeat:no-repeat,no-repeat;backdrop-filter:blur(10px)}
body.light .topbar{background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(242,247,253,.92)),url('./photos/capa-bg.jpg');background-size:auto,cover;background-position:center,center 30%;background-repeat:no-repeat,no-repeat}
.brand-logo{width:38px;height:38px;object-fit:contain;flex:none}
.topbar h1{font-size:17px;font-weight:900}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px}
.wrap{max-width:900px;margin:0 auto;padding:20px 18px 80px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{border:1px solid var(--stroke);border-radius:999px;background:rgba(255,255,255,.045);color:var(--muted);padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer}
.tabs button.active{background:linear-gradient(135deg,var(--cyan),#4f8cff);color:#06101b;border-color:transparent}
.card{border:1px solid var(--stroke);border-radius:var(--radius);background:linear-gradient(180deg,rgba(16,24,39,.7),rgba(10,16,28,.6));padding:20px;margin-bottom:16px}
body.light .card{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(246,250,255,.92))}
.card h2{font-size:16px;margin-bottom:4px}
.card .hint{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.part-title{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--cyan);margin:22px 0 12px;padding-top:14px;border-top:1px solid var(--stroke2)}
.part-title:first-of-type{border-top:0;padding-top:0;margin-top:4px}
table.roster{width:100%;border-collapse:collapse;font-size:13px}
table.roster th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--stroke2);white-space:nowrap}
table.roster td{padding:6px 8px;border-bottom:1px solid var(--stroke2);vertical-align:middle}
table.roster input,table.roster select{padding:7px 8px;font-size:13px;min-width:64px}
table.roster .name-cell{font-weight:800;white-space:nowrap;min-width:150px}
.name-cell{display:flex;align-items:center;gap:9px}
.name-cell img{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--stroke2)}
.roster-scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.msg{border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:700;margin-bottom:14px}
.msg.ok{background:rgba(50,213,131,.12);border:1px solid rgba(50,213,131,.4);color:#32d583}
.msg.err{background:rgba(249,112,102,.12);border:1px solid rgba(249,112,102,.4);color:#f97066}
.msg.warn{background:rgba(253,176,34,.12);border:1px solid rgba(253,176,34,.4);color:#fdb022}
.gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
  background-image:linear-gradient(160deg,rgba(5,7,12,.45) 0%,rgba(5,7,12,.86) 62%,var(--bg) 100%),url('./photos/pedro-capa-web.jpg');
  background-size:cover;background-position:center 15%;background-repeat:no-repeat}
body.light .gate{background-image:linear-gradient(160deg,rgba(243,247,251,.5) 0%,rgba(243,247,251,.92) 62%,var(--bg) 100%),url('./photos/pedro-capa-web.jpg')}
.gate-box{width:min(360px,92vw);text-align:center;background:var(--card);border:1px solid var(--stroke);border-radius:22px;padding:34px 28px;box-shadow:0 30px 80px rgba(0,0,0,.4);backdrop-filter:blur(8px)}
.gate-box h2{margin-bottom:6px}
.gate-box p{color:var(--muted);font-size:13px;margin:0 0 18px}
.theme-toggle{position:fixed;left:16px;bottom:16px;z-index:50;border:1px solid var(--stroke);border-radius:14px;background:rgba(255,255,255,.06);color:var(--text);padding:9px 12px;font-weight:800;cursor:pointer;font-size:12px}
.bulk-actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.foot-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h2>Área de preenchimento</h2>
    <p>Login do treinador</p>
    <div class="field" style="text-align:left"><label>Usuário</label><input type="text" id="gateLogin" autocomplete="username" /></div>
    <div class="field" style="text-align:left"><label>Senha</label><input type="password" id="gatePassword" autocomplete="current-password" /></div>
    <button class="btn primary" id="gateBtn" style="width:100%">Entrar</button>
    <div id="gateMsg" style="margin-top:10px;font-size:12.5px;color:var(--red)"></div>
  </div>
</div>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px">
    <img src="./photos/logo_sistema_do_treinador-transparent.png" alt="QG do Treinador" class="brand-logo">
    <div>
      <h1>Preenchimento da planilha</h1>
      <div class="sub" id="topbarSub">QG do Treinador · Sub-10</div>
    </div>
  </div>
  <div style="display:flex;gap:8px">
    <a class="btn" href="./index.html"><span class="ico">🏠</span>Capa</a>
    <a class="btn primary" href="./dashboard.html"><span class="ico">📊</span>Ver dashboard</a>
  </div>
</div>

<div class="wrap">
  <div id="setupWarning"></div>

  <div class="tabs" id="tabs">
    <button data-tab="atleta" class="active">Novo atleta</button>
    <button data-tab="treino">Treino</button>
    <button data-tab="avaliacao">Avaliação individual</button>
    <button data-tab="posjogo">Pós-jogo</button>
    <button data-tab="posjogoind">Pós-jogo individual</button>
  </div>

  <div id="panels"></div>
</div>

<button class="theme-toggle" id="themeToggle">☀️ Modo claro</button>

<script>
// =====================================================================
// CONFIGURAÇÃO — preencha depois de implantar o Apps Script (veja
// apps-script.gs neste mesmo repositório para as instruções de instalação).
// =====================================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyazQGCdsQR_iyh1e_lX1rDZAy792z_eLbqHYfplFW45fqHqozRd_8DVscrD2B7_ww/exec';
// Contas de acesso a esta página (login comparado sem diferenciar maiúsculas/
// minúsculas; senha guardada como hash SHA-256, não em texto puro).
// Para adicionar/trocar uma conta: gere o hash da senha (ex.: no console do
// navegador rode `crypto.subtle.digest('SHA-256', new TextEncoder().encode('sua-senha')).then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))`)
// e adicione um par {login, hash} na lista abaixo.
const ACCOUNTS = [
  { login: 'pedrohenrique', hash: '4d4f5a5396cf10094e055d1df2d4d6b09d36e5f1d9552b810c0260e2c5c4b282', nome: 'Pedro Henrique', categoria: 'Sub-10', allCategories: true }, // sub10cruzeiro
  { login: 'victorlenine', hash: '51ac9b3c7f66ee23e5549e7b65d58921a8ab0f50b22873c068cdb82b58a1ec4b', nome: 'Victor Lenine', categoria: 'Sub-13' }, // sub13cruzeiro
  { login: 'matheusteixeira', hash: 'cb78566e94a8ac4cb3cb58b61b957e669c3d016b946a0c5601cb28c4f301e746', nome: 'Matheus Teixeira', categoria: 'Sub-12' }, // sub12cruzeiro
  { login: 'raphaelbatista', hash: '1f7532d789a4a28a94cc3697c57fe3267ca878d779feb4f9369458f56e78a698', nome: 'Raphael Batista', categoria: 'Prep. Goleiros' }, // prepgoleiros
  { login: 'douglascarvalho', hash: '9b8370e2d6248d005834e852248faa6f665e8c21f50a3cdf66053136d342bbe6', nome: 'Douglas Carvalho', categoria: 'Escolinhas' }, // escolascruzeiro
  { login: 'joaofortes', hash: 'e2f5a6e0ee3009367db913b0a16aeb1f288a65de781618c82153f5b6e1c3c560', nome: 'João Fortes', categoria: 'Sub-09' }, // sub09cruzeiro
];

const QUARTIS = ['Q1','Q2','Q3','Q4'];
const POSICOES = ['Goleiro','Lateral','Defensor','Meia','Atacante'];
const PES = ['Direito','Esquerdo','Ambidestro'];
const TASK_ORDER = ['Analítico geral','Analítico em contexto específico','Jogo fundamental','Conceitual','Situacional','Jogo condicionado','Jogo formal'];
// Tipos de conteúdo, exatamente como aparecem na coluna "Tipo de conteúdo"
// da aba "Caderno de conteúdos" (não é a mesma lista de título de seção).
const CONTENT_TYPE_CATALOG=["Técnico-tático individual","Tática de grupo","Tática coletiva","Familia de habilidade esportiva"];
// Catálogo completo da aba "Caderno de conteúdos" — usado como sugestão nos
// campos de conteúdo do pós-treino, independente de já ter sido usado antes.
const CONTENT_CATALOG=["Abordagem","Ajuste corporal","Ajuste corporal defensivo","Ampliar o espaço efetivo de jogo","Antecipar a posição do adversário","Atacar marcando","Ataque posicional","Ataque rápido","Bloqueio (frontal e lateral)","Cabeceio","Cobertura","Compactação","Condução","Contra-ataque","Controle de profundidade (intersetores)","Controle de profundidade (por setor)","Cruzamento de canal","Cruzamento de quina","Cruzamento de retorno","Defender em bloco","Defesa de tabela","Desmarque de apoio","Desmarque de ruptura","Determinar momento do passe","Dinâmica de 3º homem","Domínio orientado","Drible (1x1 ofensivo)","Equilíbrio defensivo","Escaneamento","Fechar janela (setorial)","Finalização curta","Finalização de 1ª","Finalização média/longa","Fixação com bola","Ganho de intervalo","Jogo nas costas do bloco","Jogo por dentro do bloco","Jogo por fora do bloco","Manejo de bola","Mudança de direção","Organizar ângulos","Passe de apoio","Passe de ruptura","Perseguição","Pressão","Proteção de bola (pivô)","Proteção do corredor central","Proteção do corredor lateral","Rebatida","Recomposição","Reconhecer voo da bola","Redução do espaço efetivo de jogo","Regular força","Retirar da zona de pressão","Ruptura","Tabela","Temporização","Troca de corredor","Troca de marcação","Troca de posição","Ultrapassagem"];
const COMPLEX_ORDER = ['Baixa','Média','Alta'];
const LOCAIS = ['Casa','Fora'];
const PERIODOS = ['Manhã','Tarde','Noite'];
const RANKS = ['A','B','C'];
const TITULARIDADES = ['Não-relacionado','Titular','Reserva'];

let ROSTER = [];
let DATALISTS = { contents: [], opponents: [], competitions: [], platforms: [], taskTypes: [], complexity: [] };

function $(id){ return document.getElementById(id); }
function opts(arr){ return arr.map(v=>`<option value="${v}">${v}</option>`).join(''); }
function todayIso(){ return new Date().toISOString().slice(0,10); }
function fallbackPhoto(){return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="100%" height="100%" rx="9" fill="#111b2e"/><circle cx="30" cy="24" r="11" fill="#253047"/><rect x="13" y="38" width="34" height="14" rx="7" fill="#253047"/></svg>')}
function athletePhotoImg(a){ return `<img src="${a.foto||fallbackPhoto()}" onerror="this.onerror=null;this.src=fallbackPhoto()">`; }
function isoToDDMMYYYY(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }

async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

function getAccount(){ try{ return JSON.parse(sessionStorage.getItem('qgAccount')||'null'); } catch(e){ return null; } }
function myCategoria(){ const acc=getAccount(); return (acc && acc.categoria) || 'Sub-10'; }
// tolera "Sub-12"/"sub 12"/"SUB12" etc. ao comparar categoria — mesmo critério usado no dashboard,
// pra uma célula digitada de forma diferente na planilha não sumir da lista de atletas/jogos do treinador
function normCategoria(c){
  let s=String(c||'').trim().toLowerCase();
  s=s.replace(/[-_]+/g,' ');
  s=s.replace(/([a-zà-ÿ])(\d)/g,'$1 $2');
  return s.replace(/\s+/g,' ').trim();
}
async function checkGate(){
  const login = $('gateLogin').value.trim().toLowerCase();
  const pass = $('gatePassword').value;
  const hash = await sha256Hex(pass);
  const match = ACCOUNTS.find(a => a.login.toLowerCase() === login && a.hash === hash);
  if(match){
    sessionStorage.setItem('entradaAuth','1');
    sessionStorage.setItem('qgAccount', JSON.stringify({login:match.login, nome:match.nome, categoria:match.categoria, allCategories:!!match.allCategories}));
    location.reload();
  } else {
    $('gateMsg').textContent = 'Usuário ou senha incorretos.';
  }
}

function initGate(){
  if(sessionStorage.getItem('entradaAuth')==='1'){ $('gate').style.display='none'; }
  $('gateBtn').onclick = checkGate;
  $('gateLogin').addEventListener('keydown', e=>{ if(e.key==='Enter') checkGate(); });
  $('gatePassword').addEventListener('keydown', e=>{ if(e.key==='Enter') checkGate(); });
}

async function fetchRosterAndLists(){
  const warn = [];
  DATALISTS.contents = [...CONTENT_CATALOG];
  DATALISTS.taskTypes = [...TASK_ORDER];
  DATALISTS.complexity = [...COMPLEX_ORDER];
  if(SCRIPT_URL.indexOf('COLE_AQUI') === 0 || !SCRIPT_URL){
    warn.push('A URL do Apps Script ainda não foi configurada (SCRIPT_URL) — os formulários não conseguem enviar dados ainda.');
  } else {
    try{
      const res = await fetch(SCRIPT_URL, {cache:'no-store'});
      const json = await res.json();
      if(json.ok) ROSTER = json.athletes || [];
      else warn.push('Erro ao buscar lista de atletas: ' + json.error);
    }catch(e){
      warn.push('Não foi possível buscar a lista de atletas ao vivo. Confira a URL do Apps Script e o compartilhamento.');
    }
  }
  try{
    const d = await (await fetch('./data.json',{cache:'no-store'})).json();
    if(!ROSTER.length) ROSTER = (d.athletes||[]).map(a=>({
      id:a.id, nome:a.name, apelido:a.nickname, dataNascimento:a.dob, posicao:a.position, quartil:a.quartile,
      peDominante:a.foot, chegadaAoClube:a.joined, categoria:a.category, foto:a.photo,
      caracteristica:a.characteristic, pontosAMelhorar:a.improvement,
    }));
    DATALISTS.contents = [...new Set([...CONTENT_CATALOG, ...((d.meta && d.meta.contents) || [])])].sort((a,b)=>a.localeCompare(b,'pt-BR'));
    // "Tipo de tarefa" e "Complexidade" continuam texto livre (autocomplete) — a lista de sugestões
    // aprende com o que já foi digitado de verdade na planilha, em vez de ficar presa a um catálogo
    // fixo que pode não bater com o que os treinadores realmente usam
    DATALISTS.taskTypes = [...new Set([...TASK_ORDER, ...((d.meta && d.meta.taskTypes) || [])])].sort((a,b)=>a.localeCompare(b,'pt-BR'));
    DATALISTS.complexity = [...new Set([...COMPLEX_ORDER, ...((d.meta && d.meta.complexities) || [])])].sort((a,b)=>a.localeCompare(b,'pt-BR'));
    const myGames = (d.games||[]).filter(g=>normCategoria(g.category)===normCategoria(myCategoria()));
    DATALISTS.opponents = [...new Set(myGames.map(g=>g.opponent).filter(Boolean))].sort();
    DATALISTS.competitions = [...new Set(myGames.map(g=>g.competition).filter(Boolean))].sort();
    DATALISTS.platforms = [...new Set(myGames.map(g=>g.platform).filter(Boolean))].sort();
  }catch(e){ /* segue sem sugestões, formulário ainda funciona */ }
  ROSTER = ROSTER.filter(a=>normCategoria(a.categoria)===normCategoria(myCategoria()));

  if(warn.length){
    $('setupWarning').innerHTML = warn.map(w=>`<div class="msg warn">${w}</div>`).join('');
  }
  renderDatalists();
}

async function loadRosterAndLists(){
  await fetchRosterAndLists();
  renderAllPanels();
}

async function refreshRoster(){
  await fetchRosterAndLists();
  refreshRosterDependentPanels();
}

function renderDatalists(){
  const dl = (id, arr) => `<datalist id="${id}">${arr.map(v=>`<option value="${v.replace(/"/g,'&quot;')}">`).join('')}</datalist>`;
  let el = document.getElementById('datalistsHost');
  if(!el){ el = document.createElement('div'); el.id = 'datalistsHost'; document.body.appendChild(el); }
  el.innerHTML = dl('dlContents',DATALISTS.contents) +
    dl('dlOpponents',DATALISTS.opponents) + dl('dlCompetitions',DATALISTS.competitions) + dl('dlPlatforms',DATALISTS.platforms) +
    dl('dlTaskTypes',DATALISTS.taskTypes) + dl('dlComplexity',DATALISTS.complexity);
}

async function sendToScript(payload){
  if(SCRIPT_URL.indexOf('COLE_AQUI') === 0 || !SCRIPT_URL){
    return {ok:false, error:'URL do Apps Script não configurada em entrada.html.'};
  }
  try{
    const res = await fetch(SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
    });
    const text = await res.text();
    try{
      return JSON.parse(text);
    }catch(parseErr){
      // o Apps Script respondeu, mas não com JSON — normalmente sinal de que a implantação
      // pede login/permissão (ficou "Somente eu" em vez de "Qualquer pessoa"), ou a URL da
      // implantação mudou depois de uma atualização do apps-script.gs. Mostra um pedaço da
      // resposta real pra dar pra identificar a causa sem precisar abrir o DevTools.
      const preview = text.replace(/\s+/g,' ').trim().slice(0,220);
      return {ok:false, error:`resposta do Apps Script não veio em JSON (HTTP ${res.status}). Provável causa: a implantação está pedindo login/permissão, ou a URL da implantação mudou. Início da resposta: "${preview}"`};
    }
  }catch(e){
    return {ok:false, error:String(e)};
  }
}

function showMsg(container, ok, text){
  container.innerHTML = `<div class="msg ${ok?'ok':'err'}">${text}</div>`;
  if(ok) setTimeout(()=>{ if(container.firstChild) container.innerHTML=''; }, 6000);
}

// ---------- Painel: Novo atleta ----------
function panelAtleta(){
  return `<div class="card">
    <h2>Cadastro de atletas</h2>
    <div class="tabs" style="margin-bottom:16px">
      <button type="button" data-mode="novo" class="active" id="modeNovoBtn">Novo atleta</button>
      <button type="button" data-mode="editar" id="modeEditarBtn">Editar atleta existente</button>
    </div>
    <div class="hint" id="atletaHint">Preenche a linha em "Banco de atletas". O ID do atleta é gerado automaticamente.</div>
    <div id="msgAtleta"></div>
    <div class="field" id="editSelectField" style="display:none">
      <label>Selecione o atleta</label>
      <select id="a_editSelect"><option value="">— escolha —</option>${ROSTER.map(a=>`<option value="${a.id||''}">${a.apelido}</option>`).join('')}</select>
    </div>
    <div class="grid2">
      <div class="field"><label>Nome completo</label><input id="a_nome" required></div>
      <div class="field"><label>Apelido</label><input id="a_apelido" required></div>
      <div class="field"><label>Data de nascimento</label><input type="date" id="a_dob"><div class="hint" id="a_quartilHint" style="margin:6px 0 0">Quartil: —</div></div>
      <div class="field"><label>Chegada ao clube</label><input type="date" id="a_joined" value="${todayIso()}"></div>

// Quartil etário: trimestre de nascimento no ano (Jan-Mar=Q1 ... Out-Dez=Q4),
// mesma convenção usada hoje na planilha (conferida contra os dados reais).
function quartilFromDob(iso){
  if(!iso) return '';
  const mo = Number(iso.split('-')[1]);
  if(!mo) return '';
  return QUARTIS[Math.floor((mo-1)/3)];
}

function setAtletaMode(mode){

  $('modeEditarBtn').classList.toggle('active', mode==='editar');

  $('atletaHint').textContent = mode==='editar'

    : 'Preenche a linha em "Banco de atletas". O ID do atleta é gerado automaticamente.';
  if(mode==='novo'){ $('a_editSelect').value=''; clearAtletaForm(); }

// Reduz a foto (a maioria das fotos de celular tem vários MB) antes de mandar pro Apps Script —
// deixa o envio bem mais rápido e evita esbarrar em limite de tamanho de requisição.
function resizeImageFile(file, maxDim, quality){
  maxDim = maxDim || 720; quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Arquivo selecionado não é uma imagem válida.'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function uploadAthletePhoto(apelido, file){
  const dataUrl = await resizeImageFile(file);
  const r = await sendToScript({action:'uploadPhoto', apelido, imageBase64: dataUrl.split(',')[1], mimeType:'image/jpeg'});
  if(!r.ok) throw new Error(r.error || 'Falha ao enviar a foto.');
  return r.result.url;
}
function wireAtleta(){
  setAtletaMode('novo');
  $('modeNovoBtn').onclick = () => setAtletaMode('novo');
  $('modeEditarBtn').onclick = () => setAtletaMode('editar');
  $('a_editSelect').onchange = () => {
    const id = $('a_editSelect').value;
    const a = ROSTER.find(x => String(x.id) === id);
    if(a) fillAtletaForm(a); else clearAtletaForm();
  };
  $('a_dob').addEventListener('input', () => {
    const q = quartilFromDob($('a_dob').value);
    $('a_quartilHint').textContent = 'Quartil: ' + (q || '—');
  });
  $('a_fotoFile').addEventListener('change', () => {
    const file = $('a_fotoFile').files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => { $('a_fotoPreview').src = reader.result; };
    reader.readAsDataURL(file);
    $('a_fotoStatus').textContent = `"${file.name}" selecionada — enviada ao clicar em salvar.`;
  });
  $('btnAtleta').onclick = async () => {
    const nome = $('a_nome').value.trim(), apelido = $('a_apelido').value.trim();
    const msg = $('msgAtleta');
    if(!nome || !apelido){ showMsg(msg,false,'Preencha nome e apelido.'); return; }
    const editId = $('a_editSelect').value;
    if(atletaMode==='editar' && !editId){ showMsg(msg,false,'Escolha um atleta pra editar.'); return; }
    const photoFile = $('a_fotoFile').files[0] || null;
    $('btnAtleta').disabled = true;
    const data = {
      nome, apelido, dataNascimento:$('a_dob').value, chegadaAoClube:$('a_joined').value,
      quartil:quartilFromDob($('a_dob').value), posicao:$('a_posicao').value, peDominante:$('a_pe').value,
      categoria:$('a_categoria').value, linkFoto:$('a_foto').value, caracteristica:$('a_carac').value,
      pontosAMelhorar:$('a_melhorar').value,
    };
    try{
      if(photoFile && atletaMode==='editar'){
        showMsg(msg,true,'Enviando foto...');
        data.linkFoto = await uploadAthletePhoto(apelido, photoFile);
      }
      const r = atletaMode==='editar'
        ? await sendToScript({action:'updateAthlete', id:editId, data})
        : await sendToScript({action:'addAthlete', data});
      if(!r.ok){ showMsg(msg,false,'Erro: '+r.error); $('btnAtleta').disabled=false; return; }
      if(atletaMode==='editar'){
        showMsg(msg,true,'Atleta atualizado. Lista de atletas atualizada nas outras abas.');
      } else if(photoFile){
        showMsg(msg,true,`Atleta salvo (ID ${r.result.id}). Enviando foto...`);
        try{
          const url = await uploadAthletePhoto(apelido, photoFile);
          await sendToScript({action:'updateAthlete', id:r.result.id, data:{linkFoto:url}});
          showMsg(msg,true,`Atleta e foto salvos (ID ${r.result.id}). Lista de atletas atualizada nas outras abas.`);
        }catch(photoErr){
          showMsg(msg,false,`Atleta salvo (ID ${r.result.id}), mas a foto falhou: ${photoErr.message}. Pode reenviar editando o atleta.`);
        }
        clearAtletaForm();
      } else {
        showMsg(msg,true,`Atleta salvo (ID ${r.result.id}). Lista de atletas atualizada nas outras abas.`);
        clearAtletaForm();
      }
      await refreshRoster();
      const sel = $('a_editSelect');
      if(sel) sel.innerHTML = '<option value="">— escolha —</option>'+ROSTER.map(a=>`<option value="${a.id||''}">${a.apelido}</option>`).join('');
    }catch(e){
      showMsg(msg,false,'Erro: '+String(e));
    }
    $('btnAtleta').disabled = false;
  };
}

  $('btnPosJogoInd').onclick = async () => {
    const msg = $('msgPosJogoInd');
    if(!$('pi_data').value){ showMsg(msg,false,'Preencha a data.'); return; }
    const val = (cls,nick) => { const el=document.querySelector(`.${cls}[data-nick="${CSS.escape(nick)}"]`); return el?el.value:''; };
    const num = v => v===''?0:Number(v);
    const entries = ROSTER.map(a=>({
      apelido:a.apelido, titularidade: val('pi-tit',a.apelido), posicao: val('pi-pos',a.apelido) || null,
      minutagem: num(val('pi-min',a.apelido)), desempenho: val('pi-desemp',a.apelido)===''?null:Number(val('pi-desemp',a.apelido)),
      golsFeitos: num(val('pi-gf',a.apelido)), golsSofridos: num(val('pi-gs',a.apelido)), assistencias: num(val('pi-as',a.apelido)),
      cartaoAmarelo: num(val('pi-ca',a.apelido)), cartaoVermelho: num(val('pi-cv',a.apelido)),
      comentarios: val('pi-com',a.apelido) || null,
    }));
    $('btnPosJogoInd').disabled = true;
    const r = await sendToScript({action:'addGameInd',
      gameNo: $('pi_numero').value ? Number($('pi_numero').value) : null,
      date: $('pi_data').value, category: $('pi_categoria').value, entries});
    $('btnPosJogoInd').disabled = false;
    if(r.ok) showMsg(msg,true,`${r.result.rows} linha(s) salva(s).`);
    else showMsg(msg,false,'Erro: '+r.error);
  };
}

const PANELS = {
  atleta: {render: panelAtleta, wire: wireAtleta},
  treino: {render: panelTreino, wire: wireTreino},
  avaliacao: {render: panelAvaliacao, wire: wireAvaliacao},
  posjogo: {render: panelPosJogo, wire: wirePosJogo},
  posjogoind: {render: panelPosJogoInd, wire: wirePosJogoInd},
};
let activeTab = 'atleta';

function renderPanel(key){
  const p = document.getElementById(`panel-${key}`);
  if(!p) return;
  p.innerHTML = PANELS[key].render();
  PANELS[key].wire();
}

function renderAllPanels(){
  $('panels').innerHTML = Object.keys(PANELS).map(k=>`<div class="panel" id="panel-${k}" style="display:${k===activeTab?'block':'none'}"></div>`).join('');
  Object.keys(PANELS).forEach(renderPanel);
}

// Depois de cadastrar um atleta no meio do preenchimento de outra aba, só
// atualiza as duas telas que dependem da lista de atletas (avaliação e
// pós-jogo individual) — as outras abas mantêm o que já estava digitado.
function refreshRosterDependentPanels(){
  renderPanel('avaliacao');
  renderPanel('posjogoind');
}

function initTabs(){
  document.querySelectorAll('#tabs button').forEach(btn=>{
    btn.onclick = () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b===btn));
      document.querySelectorAll('.panel').forEach(p=>p.style.display = p.id==='panel-'+activeTab ? 'block':'none');
    };
  });
}

function initTheme(){
  const btn = $('themeToggle');
  btn.onclick = () => {
    document.body.classList.toggle('light');
    btn.textContent = document.body.classList.contains('light') ? '🌙 Modo escuro' : '☀️ Modo claro';
  };
}

initGate();
initTabs();
initTheme();
loadRosterAndLists();
(function(){ const acc=getAccount(); if(acc){ const sub=$('topbarSub'); if(sub) sub.textContent = `QG do Treinador · ${acc.categoria} · ${acc.nome}`; } })();
</script>
